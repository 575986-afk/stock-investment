<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>StockSim - 국내/해외주식</title>
  <!-- Tailwind CSS CDN -->
  <style>
    header { background: #fff; border-bottom: 1px solid #e1e4e8; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; }
    .logo { font-size: 20px; font-weight: bold; color: #00c7ae; text-decoration: none; }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { text-decoration: none; color: #555; font-size: 15px; font-weight: 500; }
    .nav-links a:hover { color: #00c7ae; }
    .auth-buttons { display: flex; gap: 10px; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 14px; text-decoration: none; font-weight: 500; cursor: pointer; }
    .btn-login { border: 1px solid #d1d5db; color: #374151; background: #fff; }
    .btn-signup { background: #00c7ae; color: #fff; border: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<div th:replace="~{fragments/mainHeader :: siteHeader}"></div>
<!-- 메인 콘텐츠 영역 (헤더 제외) -->
<main class="max-w-5xl mx-auto py-10 px-4">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">주식 시장 현황</h1>

  <!-- 국내 / 해외 탭 전환 버튼 -->
  <div class="flex border-b border-gray-200 mb-6">
    <button id="domesticTabBtn" onclick="switchTab('domestic')"
            class="pb-3 px-6 font-semibold text-lg transition-colors border-b-2 border-emerald-500 text-emerald-600">
      국내 주식
    </button>
    <button id="overseasTabBtn" onclick="switchTab('overseas')"
            class="pb-3 px-6 font-semibold text-lg transition-colors border-b-2 border-transparent text-gray-400 hover:text-gray-600">
      해외 주식
    </button>
  </div>

  <!-- 주식 목록 테이블 카드 -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
      <tr class="bg-gray-50 text-gray-500 text-sm border-b border-gray-100">
        <th class="py-4 px-6 font-medium">종목명</th>
        <th class="py-4 px-6 font-medium">현재가</th>
        <th class="py-4 px-6 font-medium">전일 대비</th>
        <th class="py-4 px-6 font-medium text-center">관심종목</th>
      </tr>
      </thead>
      <tbody id="stockTableBody">
      <!-- Thymeleaf 반복문 (백엔드에서 넘겨준 domesticStocks 모델 데이터 출력) -->
      <tr th:each="stock : ${domesticStocks}" class="domestic-row border-b border-gray-50 hover:bg-gray-50 transition-colors">
        <td class="py-4 px-6 font-semibold text-gray-800" th:text="${stock.name}">삼성전자</td>
        <td class="py-4 px-6 text-gray-700" th:text="${stock.price}">72,800원</td>
        <td class="py-4 px-6 font-medium"
            th:classappend="${stock.isRise} ? 'text-red-500' : 'text-blue-500'"
            th:text="${stock.change}">+1,200원 (+1.68%)</td>
        <td class="py-4 px-6 text-center">
          <button class="text-gray-400 hover:text-yellow-400">⭐</button>
        </td>
      </tr>

      <!-- Thymeleaf 반복문 (백엔드에서 넘겨준 overseasStocks 모델 데이터 출력 - 초기엔 숨김) -->
      <tr th:each="stock : ${overseasStocks}" class="overseas-row hidden border-b border-gray-50 hover:bg-gray-50 transition-colors">
        <td class="py-4 px-6 font-semibold text-gray-800" th:text="${stock.name}">Apple (AAPL)</td>
        <td class="py-4 px-6 text-gray-700" th:text="${stock.price}">$182.50</td>
        <td class="py-4 px-6 font-medium"
            th:classappend="${stock.isRise} ? 'text-red-500' : 'text-blue-500'"
            th:text="${stock.change}">+$2.30 (+1.28%)</td>
        <td class="py-4 px-6 text-center">
          <button class="text-gray-400 hover:text-yellow-400">⭐</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

<!-- 탭 전환 스크립트 -->
<script>
  function switchTab(type) {
    const domesticBtn = document.getElementById('domesticTabBtn');
    const overseasBtn = document.getElementById('overseasTabBtn');
    const domesticRows = document.querySelectorAll('.domestic-row');
    const overseasRows = document.querySelectorAll('.overseas-row');

    if (type === 'domestic') {
      domesticBtn.className = "pb-3 px-6 font-semibold text-lg transition-colors border-b-2 border-emerald-500 text-emerald-600";
      overseasBtn.className = "pb-3 px-6 font-semibold text-lg transition-colors border-b-2 border-transparent text-gray-400 hover:text-gray-600";

      domesticRows.forEach(row => row.classList.remove('hidden'));
      overseasRows.forEach(row => row.classList.add('hidden'));
    } else {
      overseasBtn.className = "pb-3 px-6 font-semibold text-lg transition-colors border-b-2 border-emerald-500 text-emerald-600";
      domesticBtn.className = "pb-3 px-6 font-semibold text-lg transition-colors border-b-2 border-transparent text-gray-400 hover:text-gray-600";

      overseasRows.forEach(row => row.classList.remove('hidden'));
      domesticRows.forEach(row => row.classList.add('hidden'));
    }
  }
</script>
</body>
</html>
